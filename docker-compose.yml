version: '3.8'

services:
  edge-ai:
    build: ./edge-ai
    container_name: edge-ai-diagnostics
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_BROKER: ${MQTT_BROKER:-192.168.50.194}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:?.env에 MQTT_USER가 없습니다}
      MQTT_PASS: ${MQTT_PASS:?.env에 MQTT_PASS가 없습니다}
      FAN_SPEED: ${FAN_SPEED:-2}
      RMS_LIMIT: ${RMS_LIMIT:-0.35}
      WARN_TH: ${WARN_TH:-0.60}
      FAULT_TH: ${FAULT_TH:-0.85}
      R1X_FAULT: ${R1X_FAULT:-0.65}
      KURT_FAULT: ${KURT_FAULT:-5.0}
      VEL_FAULT: ${VEL_FAULT:-4.5}
      ALARM_SERVER_HOST: ${ALARM_SERVER_HOST:-192.168.50.194}
      ALARM_SERVER_PORT: ${ALARM_SERVER_PORT:-50051}
      ENABLE_BUZZER_ALARM: ${ENABLE_BUZZER_ALARM:-true}
    volumes:
      - ./edge-ai:/app
